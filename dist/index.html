<title>תבליט – סטודיו לפאנל קיר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Secular+One&display=swap">
<style>
/* Layout: one-screen workbench — settings rail on the right (RTL), model stage on the left, print bar along the bottom. */
:root {
  --bg: #e6e8e3;
  --panel: #f5f6f3;
  --raised: #ffffff;
  --ink: #1b211e;
  --muted: #5d6661;
  --line: #d0d5ce;
  --accent: #d6960a;
  --accent-ink: #1b211e;
  --focus: #1f6feb;
  --warn: #b4530a;
  --warn-bg: #fdf0e1;
  --stage: #d9dbd6;
  --f-display: "Secular One", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Hebrew", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --panel: #1b201d; --raised: #232925; --ink: #e7ebe8; --muted: #9aa49f; --line: #313a35;
    --accent: #f0b429; --accent-ink: #141816; --focus: #6aa7ff; --warn: #f3a65a; --warn-bg: #3a2a17; --stage: #202622;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1b201d; --raised: #232925; --ink: #e7ebe8; --muted: #9aa49f; --line: #313a35;
  --accent: #f0b429; --accent-ink: #141816; --focus: #6aa7ff; --warn: #f3a65a; --warn-bg: #3a2a17; --stage: #202622;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: grid; height: 100%; grid-template-columns: minmax(300px, 360px) 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "top top" "panel stage" "bar bar"; }
.top { grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-size: 22px; letter-spacing: .01em; line-height: 1; }
.brand-sub { color: var(--muted); font-size: 12px; }
.top .spacer { flex: 1; }
.name-input { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); padding: 6px 10px; min-width: 0; width: 200px; }
.top select { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); padding: 6px 8px; max-width: 240px; }
.icon-btn { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg { width: 16px; height: 16px; }

.panel { grid-area: panel; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding-bottom: 24px; }
.sec { border-bottom: 1px solid var(--line); }
.sec-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: none; border: 0; text-align: right; }
.hexnum { width: 26px; height: 28px; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-size: 14px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--line); color: var(--ink); }
.sec.open .hexnum { background: var(--accent); color: var(--accent-ink); }
.sec-title { font-weight: 600; font-size: 15px; }
.sec-sum { color: var(--muted); font-size: 12px; display: block; font-weight: 400; }
.sec-head .chev { margin-inline-start: auto; transition: transform .15s; color: var(--muted); }
.sec.open .chev { transform: rotate(180deg); }
.sec-body { padding: 2px 16px 16px; display: none; flex-direction: column; gap: 12px; }
.sec.open .sec-body { display: flex; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }

.row { display: grid; grid-template-columns: 1fr 104px; gap: 4px 10px; align-items: center; }
.row label { font-size: 13px; }
.row label small { color: var(--muted); font-size: 11.5px; margin-inline-start: 4px; }
.row .num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
.row .num input { width: 100%; border: 0; background: none; padding: 4px 6px; font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: left; direction: ltr; min-width: 0; }
.row .num span { color: var(--muted); font-size: 11px; padding-inline-end: 6px; white-space: nowrap; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); direction: ltr; margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.field-label { font-size: 13px; font-weight: 600; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.plan-wrap { position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); overflow: hidden; }
.plan-wrap canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.plan-help { position: absolute; inset: auto 8px 6px auto; font-size: 11px; color: var(--muted); pointer-events: none; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tool { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; }
.tool small { color: var(--muted); font-size: 11px; }
.tool svg { width: 22px; height: 22px; }
.tool[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pointlist { display: flex; flex-wrap: wrap; gap: 6px; }
.pt-editor { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--raised); }
.btn-row { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); padding: 6px 12px; font-size: 13px; }
.btn.small { padding: 4px 9px; font-size: 12.5px; }

.bands { display: flex; gap: 6px; flex-wrap: wrap; }
.band { width: 46px; height: 34px; border-radius: 6px; border: 2px solid transparent; position: relative; font-family: var(--f-mono); font-size: 11px; display: grid; place-items: end start; padding: 2px 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.band[aria-pressed="true"] { border-color: var(--ink); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.sw { aspect-ratio: 1; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.custom-color { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.custom-color input { width: 34px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }

.stage { grid-area: stage; position: relative; background: var(--stage); min-height: 0; overflow: hidden; }
.stage-tabs { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; }
.stage-views { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--raised); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
#view3d { position: absolute; inset: 0; }
#view3d canvas { display: block; }
#viewmap { position: absolute; inset: 0; overflow: auto; padding: 64px 16px 16px; }
#viewmap svg { width: 100%; height: auto; max-height: calc(100% - 8px); display: block; margin: 0 auto; background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.stage-note { position: absolute; bottom: 10px; inset-inline-end: 12px; font-size: 11.5px; color: var(--muted); z-index: 2; pointer-events: none; }
.busy { position: absolute; top: 56px; inset-inline-start: 12px; z-index: 3; font-size: 12px; color: var(--muted); }

.bar { grid-area: bar; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--panel); }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); padding: 10px 18px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.primary:disabled { opacity: .55; cursor: progress; }
.primary svg { width: 18px; height: 18px; }
.msg { flex: 1 1 260px; min-width: 0; font-size: 12.5px; color: var(--muted); }
.msg .warn { color: var(--warn); }
.msg .err { color: var(--warn); font-weight: 600; }
.stats { display: flex; gap: 18px; }
.stat { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.stat b { font-family: var(--f-mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; direction: ltr; }
.stat span { font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }
.toast { position: fixed; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: 1fr; grid-template-rows: auto 62vh auto auto; grid-template-areas: "top" "stage" "bar" "panel"; }
  .panel { border-left: 0; overflow: visible; }
  .name-input { width: 140px; }
  .stats { gap: 12px; }
  .stage-views { top: 54px; inset-inline-end: auto; inset-inline-start: 12px; }
  .busy { top: 96px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

dialog.ask { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 20px; max-width: min(440px, calc(100vw - 32px)); box-sizing: border-box; }
dialog.ask::backdrop { background: rgba(0, 0, 0, .45); }
dialog.ask h2 { margin: 0 0 8px; font-size: 18px; }
dialog.ask p { margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.ask-btns { display: flex; flex-wrap: wrap; gap: 8px; }

</style>

<script>
/* WallEngine — parametric relief wall panel generator.
   Pure functions, no DOM. Units: millimetres. Panel lies in XY, relief grows toward +Z.
   Requires global d3 (d3-delaunay) for Voronoi tessellations. */
(function (root) {
  'use strict';

  // ---------- random ----------
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- 2D polygon utils (polygons are arrays of [x,y], CCW) ----------
  function area(p) {
    let s = 0;
    for (let i = 0, n = p.length; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n];
      s += a[0] * b[1] - b[0] * a[1];
    }
    return s / 2;
  }
  function centroid(p) {
    let cx = 0, cy = 0, s = 0;
    for (let i = 0, n = p.length; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n];
      const f = a[0] * b[1] - b[0] * a[1];
      s += f; cx += (a[0] + b[0]) * f; cy += (a[1] + b[1]) * f;
    }
    if (Math.abs(s) < 1e-9) {
      let x = 0, y = 0; p.forEach(q => { x += q[0]; y += q[1]; });
      return [x / p.length, y / p.length];
    }
    return [cx / (3 * s), cy / (3 * s)];
  }
  function ccw(p) { return area(p) < 0 ? p.slice().reverse() : p; }
  function bbox(p) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const q of p) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }
  function inside(p, pt) { // convex or not, ray casting
    let c = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const a = p[i], b = p[j];
      if (((a[1] > pt[1]) !== (b[1] > pt[1])) && (pt[0] < (b[0] - a[0]) * (pt[1] - a[1]) / (b[1] - a[1]) + a[0])) c = !c;
    }
    return c;
  }
  // same ray casting as inside(), but the edge crossings of each horizontal line are kept per polygon,
  // so many tests on the same y (the keyhole search samples a grid) cost a couple of compares each
  function insideY(p, x, y) {
    let m = p._yc; if (!m) m = p._yc = new Map();
    let xs = m.get(y);
    if (!xs) {
      xs = [];
      for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
        const a = p[i], b = p[j];
        if ((a[1] > y) !== (b[1] > y)) xs.push((b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]);
      }
      m.set(y, xs);
    }
    let c = false;
    for (let k = 0; k < xs.length; k++) if (x < xs[k]) c = !c;
    return c;
  }
  // Sutherland–Hodgman: clip subject by convex CCW clip polygon
  function clipConvex(subject, clip) {
    let out = subject;
    for (let i = 0; i < clip.length && out.length; i++) {
      const A = clip[i], B = clip[(i + 1) % clip.length];
      const inp = out; out = [];
      const side = q => (B[0] - A[0]) * (q[1] - A[1]) - (B[1] - A[1]) * (q[0] - A[0]);
      for (let j = 0; j < inp.length; j++) {
        const P = inp[j], Q = inp[(j + 1) % inp.length];
        const sp = side(P), sq = side(Q);
        if (sp >= 0) out.push(P);
        if ((sp >= 0) !== (sq >= 0)) {
          const t = sp / (sp - sq);
          out.push([P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t]);
        }
      }
    }
    return out;
  }
  // remove near-duplicate and collinear vertices, merge short edges
  function simplify(p, minEdge) {
    let q = p.slice();
    let changed = true, guard = 0;
    while (changed && q.length > 3 && guard++ < 200) {
      changed = false;
      for (let i = 0; i < q.length; i++) {
        const a = q[i], b = q[(i + 1) % q.length];
        if (Math.hypot(b[0] - a[0], b[1] - a[1]) < minEdge) {
          const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          q.splice(i, 1, m); q.splice((i + 1) % (q.length), 1);
          changed = true; break;
        }
      }
      if (changed) continue;
      for (let i = 0; i < q.length; i++) {
        const a = q[(i - 1 + q.length) % q.length], b = q[i], c = q[(i + 1) % q.length];
        const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
        const l = Math.hypot(b[0] - a[0], b[1] - a[1]) * Math.hypot(c[0] - b[0], c[1] - b[1]);
        if (Math.abs(cr) < 0.02 * l) { q.splice(i, 1); changed = true; break; } // ~1.1°
      }
    }
    return q;
  }
  function isConvexCCW(p) {
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length], c = p[(i + 2) % p.length];
      if ((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]) < -1e-6) return false;
    }
    return area(p) > 0;
  }
  // offset convex CCW polygon inward by d, keeping vertex count; null if it collapses
  function inset(p, d, concave) {
    if (d === 0) return p.slice();
    const n = p.length, lines = [];
    for (let i = 0; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      if (L < 1e-9) return null;
      const nx = -dy / L, ny = dx / L; // left normal = interior
      const di = Array.isArray(d) ? d[i] : d;
      lines.push({ px: a[0] + nx * di, py: a[1] + ny * di, dx: dx / L, dy: dy / L });
    }

      out.push(`<path d="M${P(m.F1)}L${P(m.E)}L${P(m.F2)}" fill="none" stroke="#c0392b" stroke-width="0.5"/>`);

  function plateSVG(plate, pr, title, colorHex) {

  const v = new THREE.Vector3(...dirs[mode]).normalize().multiplyScalar(d);
  camera.position.copy(v); controls.target.set(0, 0, 10); camera.near = d / 50; camera.far = d * 10; camera.updateProjectionMatrix(); controls.update(); invalidate();
  document.querySelectorAll('#camViews [data-cam]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cam === mode)));
}
function resize() {
  const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h; camera.updateProjectionMatrix(); invalidate();
}
new ResizeObserver(resize).observe(host);
// render on demand: only while the camera moves or after the scene changed (keeps the CPU free for building print files)
var dirty = 2;
function invalidate() { dirty = 2; }
controls.addEventListener('change', invalidate);
(function loop() { if (controls.update()) dirty = 2; if (dirty > 0) { renderer.render(scene, camera); dirty--; } requestAnimationFrame(loop); })();

// ---------- rebuild pipeline ----------
let timer = 0;
// the live model never has hanging keyholes (their search is the slow part of a build); they are added
// only when the print kit is downloaded and the user asks for them
function schedule(draft) { clearTimeout(timer); $('#busy').hidden = false; timer = setTimeout(rebuild, draft === true ? 30 : 70); }
function rebuild() {
  const t0 = performance.now();
  try { model = E.build(state, true); buildError = null; }
  catch (e) { buildError = e.message || String(e); console.warn(e); }
  $('#busy').hidden = true;
  if (!buildError) { update3D(); drawPlan(); if (!$('#viewmap').hidden) drawMap(); }
  updateBar();
  window.__lastBuildMs = performance.now() - t0;
}
function plateCount() {
  if (!model) return 0;
  let n = 0;
  state.color.bands.forEach((_, b) => { const items = model.pieces.filter(c => c.band === b).map(c => ({ w: c.fp.w, h: c.fp.h })); if (items.length) n += E.packPlates(items, state.print).length; });
  return n;
}
function weightGrams() {
  if (!model) return 0;
  let vol = 0; const fr = state.frame;
  model.pieces.forEach(c => vol += E.meshVolume(E.pieceMesh(c, fr)) * 0.5);
  model.tiles.forEach(tl => vol += E.meshVolume(E.tileMesh(tl, fr)) * 0.85);
  return vol / 1000 * 1.24;
}
function updateBar() {
  const msg = $('#msg'); msg.textContent = '';
  if (buildError) { msg.append(el('span', { class: 'err' }, buildError)); $('#kitBtn').disabled = true; return; }
  $('#kitBtn').disabled = false;
  if (model.warnings.length) model.warnings.forEach(w => msg.append(el('div', { class: w.kind === 'warn' ? 'warn' : '' }, w.text)));
  else msg.append('הכול מוכן להדפסה. כל קודקוד נבדק לזווית הדפסה בלי תמיכות ולמרחק מהשכנים.');
  const stats = [[model.pieces.length, 'חלקים'], [state.color.bands.length, 'צבעים'], [model.tiles.length, 'אריחי מסגרת'], [plateCount(), 'פלטות'], [Math.round(model.maxZ) + ' מ"מ', 'עומק'], ['≈' + Math.round(weightGrams()) + ' ג׳', 'משקל']];
  const st = $('#stats'); st.textContent = '';
  stats.forEach(([v, l]) => st.append(el('div', { class: 'stat' }, el('b', {}, String(v)), el('span', {}, l))));
}

// ---------- assembly map view ----------
function drawMap() { if (model) $('#viewmap').innerHTML = K.assemblySVG(model, state); }
function setTab(map) {
  $('#tab3d').setAttribute('aria-pressed', String(!map)); $('#tabMap').setAttribute('aria-pressed', String(map));
  $('#viewmap').hidden = !map; $('#view3d').style.visibility = map ? 'hidden' : 'visible';
  $('#camViews').hidden = map; $('#stageNote').textContent = map ? 'המספרים כאן זהים למספרים בפלטות. קו כחול מקווקו: גבול של אריח מסגרת.' : 'גרירה: סיבוב · Shift או כפתור ימני: הזזה · גלגלת: זום';
  if (map) drawMap();
}

// ---------- downloads ----------
const dlP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
function toast(t, ms = 3800) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(e._t); e._t = setTimeout(() => e.hidden = true, ms); }
async function offerFile(filename, blob) {
  const dl = await Promise.race([dlP, new Promise(r => setTimeout(() => r(null), 1500))]);
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('הקובץ נשמר.'); }
    catch (e) { if (e && e.code === 'declined') toast('ההורדה בוטלה.'); else toast('לא הצלחתי לשמור את הקובץ כאן (' + (e?.code || 'שגיאה') + ').'); }
    return;
  }
  const a = el('a', { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
const slug = s => (s || 'panel').replace(/[^\w֐-׿-]+/g, '-').replace(/^-|-$/g, '') || 'panel';
// asks whether to add hanging keyholes; resolves true / false, or null when cancelled
function askHang() {
  return new Promise(res => {
    const dlg = el('dialog', { class: 'ask', 'aria-labelledby': 'askTitle' });
    const done = v => { dlg.close(); dlg.remove(); res(v); };
    dlg.append(
      el('h2', { id: 'askTitle' }, 'האם להוסיף חורי תלייה?'),
      el('p', {}, 'חורי מנעול בצורת L ליד ארבע הפינות, בתוך החלקים שיש בהם מקום, לפי המנגנון שגיבשנו. מפת ההרכבה תתעדכן בהתאם. החישוב לוקח כמה שניות.'),
      el('div', { class: 'ask-btns' },
        el('button', { class: 'primary', onclick: () => done(true) }, 'כן, להוסיף חורי תלייה'),
        el('button', { class: 'btn', onclick: () => done(false) }, 'לא, בלי חורים'),
        el('button', { class: 'btn', onclick: () => done(null) }, 'ביטול')));
    dlg.addEventListener('cancel', e => { e.preventDefault(); done(null); });
    document.body.append(dlg); dlg.showModal();
  });
}
$('#kitBtn').addEventListener('click', async () => {
  clearTimeout(timer); rebuild();
  if (!model) return;
  const hang = await askHang();
  if (hang === null) return;
  const btn = $('#kitBtn'); btn.disabled = true; const old = btn.innerHTML;
  btn.lastChild.textContent = hang ? 'מחשב חורי תלייה…' : 'מכין קבצים…';
  await new Promise(r => setTimeout(r, 30));   // let the label paint before the long build
  try {
    const st = clone(state); st.frame.hang = Object.assign({}, st.frame.hang, { on: hang });
    const km = hang ? E.build(st) : model;
    if (hang) {
      btn.lastChild.textContent = 'מכין קבצים…';
      const hw = km.warnings.filter(w => /תלייה|חור/.test(w.text));
      if (hw.length) toast(hw.map(w => w.text).join(' '), 9000);
    }
    const names = st.color.bands.map(h => (PR.palette.find(p => p[1] === h.toLowerCase()) || [h.slice(1)])[0]);
    const { blob } = await K.buildKit(km, st, window.JSZip, { colorNames: names.map(n => /^[0-9a-f]{6}$/i.test(n) ? n : n) });
    await offerFile('tavlit-print-kit.zip', blob);
  } catch (e) { console.error(e); toast('יצירת הערכה נכשלה: ' + e.message, 6000); }
  btn.innerHTML = old; btn.disabled = false;
});
$('#fitBtn').addEventListener('click', async () => {
  try { const blob = await K.buildFitTest(state, window.JSZip); await offerFile('fit-test-mk4.zip', blob); }
  catch (e) { toast('יצירת בדיקת ההתאמה נכשלה: ' + e.message, 6000); }
});
$('#saveBtn').addEventListener('click', () => offerFile('tavlit-design.json', new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })));
$('#loadFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { state = normalize(JSON.parse(await f.text())); selPoint = 0; selBand = 0; commit(); renderPanel(); schedule(); lastSize = null; toast('העיצוב נטען.'); }
  catch (err) { toast('הקובץ לא נראה כמו עיצוב שנשמר מכאן.'); }
  e.target.value = '';
});

// ---------- header & tabs ----------
const sel = $('#presetSel');
sel.append(el('option', { value: '' }, 'עיצובים מוכנים…'), ...PR.presets.map(p => el('option', { value: p.key }, p.label)));
sel.addEventListener('change', () => {
  const p = PR.presets.find(x => x.key === sel.value); sel.value = ''; if (!p) return;
  state = normalize(clone(p.state)); selPoint = 0; selBand = 0; addMode = null; lastSize = null; commit(); renderPanel(); schedule();
});
$('#designName').addEventListener('change', e => { state.name = e.target.value.trim() || 'עיצוב'; commit(); });
$('#undoBtn').addEventListener('click', () => hIndex > 0 && restore(hIndex - 1));
$('#redoBtn').addEventListener('click', () => hIndex < history.length - 1 && restore(hIndex + 1));
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.target.matches('input[type=number],input[type=text],input:not([type])')) return;
  if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); hIndex > 0 && restore(hIndex - 1); }
  else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { e.preventDefault(); hIndex < history.length - 1 && restore(hIndex + 1); }
});
$('#tab3d').addEventListener('click', () => setTab(false));
$('#tabMap').addEventListener('click', () => setTab(true));
document.querySelectorAll('#camViews [data-cam]').forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));
$('#showFrame').addEventListener('click', e => { frameGroup.visible = !frameGroup.visible; e.currentTarget.setAttribute('aria-pressed', String(frameGroup.visible)); });
$('#showPieces').addEventListener('click', e => { pieceGroup.visible = !pieceGroup.visible; e.currentTarget.setAttribute('aria-pressed', String(pieceGroup.visible)); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', drawPlan);

renderPanel(); updateUndo(); resize(); rebuild();
window.__tavlit = { get state() { return state; }, get model() { return model; }, rebuild, setState: s => { state = normalize(s); lastSize = null; renderPanel(); rebuild(); } };

</script>
